[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babeldoc"
version = "0.1.0"
description = "A document translation tool powered by AI — Fork of funstory-ai/BabelDOC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "BabelDOC Contributors" },
]
keywords = ["translation", "document", "pdf", "ai", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
babeldoc = "babeldoc.cli:main"

[project.urls]
Homepage = "https://github.com/babeldoc/babeldoc"
Repository = "https://github.com/babeldoc/babeldoc"
Issues = "https://github.com/babeldoc/babeldoc/issues"
Changelog = "https://github.com/babeldoc/babeldoc/releases"

[tool.hatch.build.targets.wheel]
packages = ["babeldoc"]

[tool.ruff]
line-length = 88  # prefer black-compatible line length over the upstream 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["babeldoc"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# removed --cov-report=xml since I'm not using CI coverage uploads locally
addopts = "--cov=babeldoc --cov-report=term-missing"

[tool.coverage.run]
source = ["babeldoc"]
omit = ["tests/*"]
